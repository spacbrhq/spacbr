# systemd drop-in for getty@tty1.service -- auto-logs @SPACBR_USERNAME@
# in on tty1 with no password prompt of its own. Deployed by
# install/live-install.sh (Phase 1, sed-substituted directly) and kept
# in sync by install/functions/system.sh's deploy_autologin() (Phase 2,
# for `spacbr update`/`repair` or a standalone `spacbr install`).
#
# Not a second password: this system's only authentication is the
# LUKS2 passphrase entered at Plymouth during early boot, before
# systemd -- and therefore this unit -- is even reached. See
# docs/architecture.md, "Boot & authentication".
#
# Exact syntax verified against ArchWiki's "Getty" page (Automatic
# login to virtual console), not guessed. Two things there matter
# beyond the autologin line itself, both specific to the "start X
# automatically from this tty" case (not the plain-autologin-to-a-
# shell case, which the wiki treats differently):
#   - Type=simple, not the getty default Type=idle -- the wiki notes
#     idle can interleave with late boot messages when something
#     starts immediately off this tty instead of just sitting at a
#     prompt.
#   - Environment=XDG_SESSION_TYPE=x11 -- without a real display
#     manager, nothing else tells logind/systemd --user this is a
#     graphical session; loginctl would otherwise default it to "tty".
#     (.config/xinitrc's own dbus-update-activation-environment call
#     covers a related but distinct gap -- DISPLAY/XAUTHORITY reaching
#     D-Bus activation -- so both stay; this doesn't replace that.)
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin @SPACBR_USERNAME@ - $TERM
Type=simple
Environment=XDG_SESSION_TYPE=x11
