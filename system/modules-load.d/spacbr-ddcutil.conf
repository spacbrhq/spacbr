# Loads i2c-dev at boot so ddcutil can talk to the monitor over DDC/CI
# (see .local/src/dwm/config.h's brightness keybindings). Without this,
# /dev/i2c-* doesn't exist until something else loads the module --
# verified for real that a fresh boot has no i2c-dev loaded and
# ddcutil fails outright until `modprobe i2c-dev` is run by hand.
i2c-dev
