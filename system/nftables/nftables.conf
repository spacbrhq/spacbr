#!/usr/sbin/nft -f
# SPACBR firewall -- deployed to /etc/nftables.conf, loaded by the
# stock nftables.service (no separate SPACBR-owned unit needed: the
# package already ships one that just loads this file at boot).
#
# nftables directly, not ufw: it's Arch's own native backend already
# (ufw is a Python wrapper generating rules for the same subsystem),
# and a static ruleset loaded once at boot has no business going
# through an extra abstraction layer just to be more approachable.
#
# Policy: default-deny inbound, unrestricted outbound. The actual
# threat model for a personal desktop is unsolicited inbound
# connections, not auditing/whitelisting the machine's own outbound
# traffic -- that would break far more than it protects here and isn't
# what was asked for.
#
# SSH (22) is allowed because this machine actually runs sshd and is
# reached over LAN for exactly that. If a given machine doesn't run
# sshd, delete that one rule -- everything else still applies.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Already-established connections (including replies to this
        # machine's own outbound traffic, e.g. DHCP renewal, DNS,
        # browsing) -- without this, normal outbound use would break
        # despite outbound itself being unrestricted.
        ct state established,related accept
        ct state invalid drop

        # Loopback
        iif lo accept

        # Ping -- useful for LAN diagnostics, negligible risk.
        icmp type echo-request accept
        icmpv6 type echo-request accept

        # SSH
        tcp dport 22 accept

        # NetBird (mesh VPN, replaced Tailscale -- see packages/aur):
        # deliberately NO rule for it here, and that's not an oversight.
        # Two reasons, per NetBird's own docs
        # (docs.netbird.io/about-netbird/ports-and-firewalls):
        #   1. The client needs no inbound firewall port at all in a
        #      standard NAT'd deployment -- purely outbound STUN/relay
        #      negotiation (ct state established,related above already
        #      covers replies to that), unlike Tailscale's fixed
        #      UDP 41641 that used to need an explicit accept here.
        #   2. NetBird manages its own separate nftables table (its own
        #      `table ... netbird { ... }`, not this `table inet
        #      filter`) for the wt0 interface, specifically designed
        #      not to need an entry in a host's own ruleset the way
        #      Tailscale's iifname "tailscale0" rule (removed along
        #      with Tailscale itself -- see git history for that rule
        #      and the real iif-vs-iifname boot-ordering bug it carried,
        #      still a useful lesson even though the rule itself is
        #      gone) did.
        # One thing this hasn't been verified against: `flush ruleset`
        # above runs on every load of *this* file, and whether that
        # could ever race against NetBird's own dynamically-created
        # table (e.g. if netbird's service starts and populates its
        # table, then something re-runs `nft -f` on this file) isn't
        # confirmed safe or unsafe -- neither claim has been tested. If
        # NetBird connectivity ever silently breaks specifically after
        # an nftables reload/repair, look here first.

        # Syncthing -- sync protocol (TCP+UDP 22000) and local network
        # discovery (UDP 21027), verified live via `ss -tlnp`/`ss
        # -ulnp`. Its web GUI (8384) is not listed here on purpose: it
        # already only binds 127.0.0.1, so it's reachable over loopback
        # (already allowed above) and was never exposed to the network
        # in the first place -- adding a rule for it would only ever
        # loosen that, never needed to preserve it.
        tcp dport 22000 accept
        udp dport 22000 accept
        udp dport 21027 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
