# SPACBR override: auto-restart dunst if it crashes.
#
# Verified for real: dunst died twice with "X connection to :0 broken
# (explicit kill or server shutdown)" during this session, and the
# stock unit has no Restart= at all -- once dead, it only comes back
# when some app's next notify-send happens to trigger D-Bus
# activation again (and that can itself hit systemd's start-limit-hit
# if it fails a few times in a row). In between, every notification
# silently goes nowhere, which is what made "notifications aren't
# working" true some of the time and not others -- not a config
# problem, a missing restart policy.
[Service]
Restart=on-failure
RestartSec=1
