# eightharsh's tmux.conf -- $XDG_CONFIG_HOME/tmux/tmux.conf, native
# support since tmux 3.1 (this machine runs 3.7c), no legacy
# ~/.tmux.conf needed.

# True color, matching every other terminal app in this repo
# (st/nvim/vim/rmpc all assume it).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# nvim reacts to Esc noticeably slower than tmux's 500ms default --
# this is the standard fix.
set -sg escape-time 10

set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi

# Split panes in the current pane's working directory, with more
# mnemonic keys than tmux's own default (% and ").
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vi-style pane navigation/resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "tmux.conf reloaded"

# Status bar -- eightchrome palette, matching dwmblocks/dmenu/st.
set -g status-style "bg=#2f343f,fg=#e1e3e7"
set -g status-left "#[bg=#4084d6,fg=#2f343f,bold] #S #[bg=#2f343f,fg=#e1e3e7] "
set -g status-left-length 20
set -g status-right "#[fg=#404552]%Y-%m-%d %H:%M "
set -g window-status-current-format "#[bg=#4084d6,fg=#2f343f,bold] #I:#W "
set -g window-status-format " #I:#W "
set -g pane-border-style "fg=#404552"
set -g pane-active-border-style "fg=#4084d6"
set -g message-style "bg=#4084d6,fg=#2f343f"
