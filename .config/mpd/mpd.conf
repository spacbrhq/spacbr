# eightharsh's mpd.conf
#
# Runs as the user-level systemd service (mpd.socket/mpd.service under
# systemctl --user), not the system-wide mpd user/service the package
# also ships -- this is a personal desktop, not a shared multi-user
# box, and running as the actual user means it reads ~/Music directly
# with no permission setup needed. All state lives under XDG paths,
# nothing outside $HOME.

music_directory    "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/share/mpd/database"
log_file           "~/.local/state/mpd/log"
state_file         "~/.local/state/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"

# pulse, not alsa: PipeWire owns audio on SPACBR (see CLAUDE.md's
# responsibility model) -- going through its PulseAudio-compat layer
# is what every other audio-producing app here already does, rather
# than a second app trying to open the ALSA device directly alongside
# PipeWire.
audio_output {
    type "pulse"
    name "PipeWire (via pulse)"
}

restore_paused "yes"
auto_update    "yes"
