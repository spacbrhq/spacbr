name: shellcheck

# Catches the exact class of bug this project already found by hand
# and fixed repeatedly (unescaped variables reaching a shell that
# doesn't quote them, `set --`/exit-status mistakes, etc.) before it
# ships, for free -- not a substitute for the real-hardware testing
# this project's own bug fixes are grounded in, just a cheap first
# pass that doesn't need real hardware to run.
on:
  push:
    paths:
      - "**/*.sh"
      - ".local/bin/**"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - ".local/bin/**"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships shellcheck already -- no install step
      # needed, matching CLAUDE.md's own "smallest reliable tools,
      # avoid dependency creep" philosophy applied to tooling too.
      - name: Run shellcheck
        run: |
          set -eu
          status=0
          # Every .local/bin/* script, plus the installer and its
          # shared functions -- the same two directories this
          # project's own scripts actually live in. Dialect picked
          # from each file's real shebang (bash vs sh), not assumed,
          # since checking a bash script as strict POSIX sh produces
          # nothing but false positives (SC3xxx).
          for f in .local/bin/* install/*.sh install/functions/*.sh; do
            [ -f "$f" ] || continue
            shebang=$(head -1 "$f")
            case "$shebang" in
              *bash*) dialect=bash ;;
              *sh*) dialect=sh ;;
              *) continue ;;
            esac
            echo "::group::$f ($dialect)"
            shellcheck -x -s "$dialect" "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
